name: CI

# Push only: a `pull_request` trigger alongside this one runs the whole suite
# twice for every commit on a same-repo PR, and the push run already reports
# onto the PR.
on:
  push:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # No secrets needed: the catalog is content-as-code and the deals fixture uses
  # placeholder redemption codes. Auth needs a secret to initialise at all, and
  # with no RESEND_API_KEY the magic link is written to disk for the e2e run.
  AUTH_SECRET: ci-not-a-real-secret-ci-not-a-real-secret
  # Auth.js rejects requests as UntrustedHost off Vercel unless told the host is
  # trustworthy. Production needs this too - see .env.example.
  AUTH_TRUST_HOST: "true"
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      # Covers the content schema and the gating leak tests: no premium deal's
      # code, partner link or claim steps may survive redaction.
      - run: pnpm test

      # Fails if any deal file is invalid, so a broken catalog cannot merge.
      - run: pnpm build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Create the local database
        run: |
          mkdir -p .data
          pnpm db:push --force

      - run: pnpm build

      # Walks anonymous → signed-in free → member, asserting a premium deal's
      # claim steps never reach the HTML of a non-member.
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
